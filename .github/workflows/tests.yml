name: tests
on:
  push:
    branches: [master]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.stability }}
    env:
      COMPOSER_NO_SECURITY_BLOCKING: 1
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        laravel: ['^9.7', '^10.0', '^11.0', '^12.0', '^13.0']
        stability: [prefer-lowest, prefer-stable]
        include:
          - { laravel: '^9.7',  testbench: '^7.0' }
          - { laravel: '^10.0', testbench: '^8.0' }
          - { laravel: '^11.0', testbench: '^9.0' }
          - { laravel: '^12.0', testbench: '^10.0' }
          - { laravel: '^13.0', testbench: '^11.0' }
        exclude:
          - { laravel: '^11.0', php: '8.1' }
          - { laravel: '^12.0', php: '8.1' }
          - { laravel: '^13.0', php: '8.1' }
          - { laravel: '^13.0', php: '8.2' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
      - name: Install dependencies
        run: |
          composer require "illuminate/http:${{ matrix.laravel }}" "illuminate/support:${{ matrix.laravel }}" "illuminate/validation:${{ matrix.laravel }}" --no-interaction --no-update
          composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-stable --prefer-dist --no-interaction --no-progress
      - name: Run tests
        run: vendor/bin/phpunit
